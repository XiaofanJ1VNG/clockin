<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Tap Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080808;
    --bg-raised:#141414;
    --line:#232323;
    --text:#f2efe9;
    --text-dim:#8a8880;
    --amber:#05dc7f;        /* primary: main buttons */
    --amber-dim:#03613a;
    --pink:#9945ff;         /* accent: purple, smaller buttons/text */
    --orange:#ff631b;       /* accent: orange, smaller buttons/text */
    --green:#05dc7f;
    --red:#e0116f;          /* danger/stop only */
    --grad-1:#05dc7f;
    --grad-2:#00664e;
    --grad-3:#152e2b;
    --grad-4:#080808;
    --grad-5:#19188c;
    --mono:'DM Mono', monospace;
    --sans:'Inter', sans-serif;
  }

  /* While the fluid gradient is showing, the near-black stroke color
     disappears against it. Brighten borders to match --text-dim so
     tabs, buttons, and dividers stay visible over the gradient. */
  body.is-running{
    --line:#8a8880;
  }

  /* Difference-blend variant: strokes/dim text that sit directly over
     the gradient (not inside an opaque card) invert against whatever
     gradient color is beneath them. Difference blend alone isn't a
     full guarantee — it can under-perform where the foreground and
     background luminance happen to be close (notably the bright
     green gradient stop) — so a soft dark drop-shadow rides along as
     a fallback layer of contrast underneath the blend. */
  .invert-on-gradient{
    mix-blend-mode:difference;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }
  a{color:inherit;}

  /* ---------- Animated fluid gradient background (running state) ---------- */
  .bg-gradient{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:var(--grad-4);
    overflow:hidden;
  }

  .bg-gradient .blob{
    position:absolute;
    width:75vmax;
    height:75vmax;
    border-radius:50%;
    mix-blend-mode:screen;
    filter:blur(40px);
    opacity:0;
    transition:opacity 1.3s ease;
    will-change:transform;
  }
  body.is-running .bg-gradient .blob{ opacity:0.85; }

  .blob-1{
    background:radial-gradient(circle at center, var(--grad-1), transparent 70%);
    top:-20%; left:-15%;
    animation:drift1 26s ease-in-out infinite;
  }
  .blob-2{
    background:radial-gradient(circle at center, var(--grad-5), transparent 70%);
    top:30%; left:40%;
    animation:drift2 34s ease-in-out infinite;
  }
  .blob-3{
    background:radial-gradient(circle at center, var(--grad-2), transparent 70%);
    top:55%; left:-10%;
    animation:drift3 30s ease-in-out infinite;
  }
  .blob-4{
    background:radial-gradient(circle at center, var(--grad-3), transparent 72%);
    top:5%; left:30%;
    animation:drift4 22s ease-in-out infinite;
  }

  @keyframes drift1{
    0%   { transform:translate(0%, 0%) scale(1); }
    33%  { transform:translate(18%, 22%) scale(1.15); }
    66%  { transform:translate(-8%, 15%) scale(0.9); }
    100% { transform:translate(0%, 0%) scale(1); }
  }
  @keyframes drift2{
    0%   { transform:translate(0%, 0%) scale(1); }
    40%  { transform:translate(-22%, -14%) scale(0.85); }
    70%  { transform:translate(-10%, 20%) scale(1.2); }
    100% { transform:translate(0%, 0%) scale(1); }
  }
  @keyframes drift3{
    0%   { transform:translate(0%, 0%) scale(1); }
    30%  { transform:translate(15%, -18%) scale(1.1); }
    65%  { transform:translate(25%, 8%) scale(0.95); }
    100% { transform:translate(0%, 0%) scale(1); }
  }
  @keyframes drift4{
    0%   { transform:translate(0%, 0%) scale(1); }
    50%  { transform:translate(-16%, 24%) scale(1.2); }
    100% { transform:translate(0%, 0%) scale(1); }
  }

  @media (prefers-reduced-motion: reduce){
    .bg-gradient .blob{ animation:none !important; }
  }

  .wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:0 20px;
    width:100%;
    position:relative;
    z-index:1;
  }

  /* ---------- Top-left brand mark ---------- */
  .brand{
    position:fixed;
    top:20px; left:20px;
    font-family:var(--mono);
    font-size:13px;
    letter-spacing:0.04em;
    color:var(--text-dim);
    display:flex;
    align-items:center;
    gap:8px;
    z-index:10;
  }
  .brand .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--text-dim);
    transition:background .3s;
  }
  .brand .dot.running{ background:var(--orange); box-shadow:0 0 8px var(--orange); animation:pulse 1.6s ease-in-out infinite; }
  .brand .dot.saved{ background:var(--green); box-shadow:0 0 8px var(--green); }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .handle-link{
    position:fixed;
    top:20px; right:20px;
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-dim);
    text-decoration:none;
    border:1px solid var(--line);
    padding:6px 10px;
    border-radius:20px;
    z-index:10;
  }
  .handle-link:hover{ border-color:var(--text-dim); color:var(--text); }

  /* ---------- Onboarding (no handle yet) ---------- */
  .onboard{
    max-width:440px;
    width:100%;
    text-align:center;
  }
  .onboard h1{
    font-family:var(--mono);
    font-size:28px;
    font-weight:500;
    line-height:1.3;
    margin-bottom:14px;
    letter-spacing:-0.01em;
  }
  .onboard p{
    color:var(--text-dim);
    font-size:15px;
    line-height:1.6;
    margin-bottom:28px;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:8px;
    text-align:left;
    margin-bottom:16px;
  }
  .field label{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--text-dim);
  }
  input[type=text]{
    background:var(--bg-raised);
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--mono);
    font-size:16px;
    padding:14px 16px;
    border-radius:8px;
    outline:none;
    width:100%;
    transition:border-color .2s;
  }
  input[type=text]:focus{ border-color:var(--amber); }
  .hint{ font-size:12.5px; color:var(--text-dim); margin-top:6px; }

  button{
    font-family:var(--sans);
    font-weight:600;
    font-size:15px;
    border:none;
    border-radius:8px;
    padding:14px 20px;
    cursor:pointer;
    transition:transform .1s ease, opacity .2s ease, background .2s ease;
  }
  button:active{ transform:scale(0.97); }
  .btn-primary{
    background:var(--amber);
    color:#1a0500;
    width:100%;
  }
  .btn-primary:hover{ opacity:0.92; }
  .btn-primary:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn-ghost{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text);
  }
  .btn-ghost:hover{ border-color:var(--text-dim); }
  .btn-stop{
    background:var(--amber-dim);
    color:var(--amber);
    border:1px solid var(--amber);
  }
  .btn-danger-text{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:13px;
    text-decoration:underline;
    padding:4px;
  }

  /* ---------- Main tracker ---------- */
  .tracker{
    width:100%;
    max-width:480px;
    /* First-screen height on mobile: tuned so the clock sits centered
       and the log's Total row just peeks in below, without showing
       individual entries. If this cutoff feels off on your phone,
       adjust the subtracted px value — larger number = shorter
       tracker area = Total appears higher/sooner. */
    min-height:calc(100svh - 142px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:36px;
    padding-top:24px;
    padding-bottom:24px;
  }
  .project-tag{
    font-family:var(--mono);
    font-size:13px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.08em;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .project-tag .name{ color:var(--text); }

  .clockface{
    font-family:var(--mono);
    font-weight:500;
    font-size:clamp(56px, 17vw, 112px);
    font-variant-numeric:tabular-nums;
    letter-spacing:-0.01em;
    line-height:1;
    display:flex;
    align-items:baseline;
    justify-content:center;
    width:100%;
    max-width:280px;
  }
  .clockface .colon{ transition:opacity .1s; }
  .clockface.running .colon{ animation:blink 1s steps(1) infinite; color:var(--orange); }
  @keyframes blink{ 50%{ opacity:0.15; } }
  .clockface.idle{ color:var(--text-dim); }

  .status-line{
    font-family:var(--mono);
    font-size:13px;
    color:var(--text-dim);
    min-height:18px;
    text-align:center;
  }

  .main-action{
    width:100%;
    max-width:280px;
  }
  .main-action button{
    width:100%;
    font-size:17px;
    padding:18px;
  }

  .utility-row{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .utility-row button{
    background:none;
    border:1px solid var(--line);
    color:var(--text-dim);
    font-size:13px;
    font-weight:500;
    padding:9px 16px;
    border-radius:20px;
  }
  .utility-row button:hover{ border-color:var(--pink); color:var(--pink); }
  body.is-running .utility-row button{
    mix-blend-mode:difference;
    border-color:#ffffff;
    color:#ffffff;
    text-shadow:0 1px 3px rgba(0,0,0,0.6);
    box-shadow:0 0 0 1px rgba(0,0,0,0.35) inset;
  }

  /* ---------- Manual entry modal ---------- */
  .modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
  }
  .modal-panel{
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:12px;
    padding:24px;
    width:100%;
    max-width:400px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .modal-panel h3{
    font-family:var(--mono);
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--text);
  }
  .modal-field{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .modal-field label{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--text-dim);
  }
  .modal-row{
    display:flex;
    gap:10px;
  }
  .modal-row .modal-field{ flex:1; min-width:0; }
  .modal-actions{
    display:flex;
    gap:8px;
    justify-content:flex-end;
    margin-top:6px;
  }
  .modal-actions button{
    font-size:14px;
    padding:10px 18px;
    width:auto;
  }
  .modal-error{
    font-size:12.5px;
    color:var(--red);
  }

  /* ---------- Assign panel ---------- */
  .assign-panel{
    width:100%;
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:12px;
    padding:24px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .assign-panel .elapsed-summary{
    font-family:var(--mono);
    font-size:22px;
    text-align:center;
    color:var(--green);
    padding-bottom:4px;
  }
  select{
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--sans);
    font-size:15px;
    padding:12px 14px;
    border-radius:8px;
    outline:none;
    width:100%;
  }
  select:focus{ border-color:var(--amber); }
  .new-project-row{
    display:flex;
    gap:8px;
  }
  .new-project-row input{ flex:1; }
  .new-project-row button{
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    padding:0 16px;
    font-size:14px;
    white-space:nowrap;
  }
  .new-project-row button:hover{ border-color:var(--pink); color:var(--pink); }

  /* ---------- Log ---------- */
  .log{
    width:100%;
    max-width:480px;
    margin-top:8px;
  }
  .log-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    gap:10px;
    flex-wrap:wrap;
  }
  .log-header h2{
    font-family:var(--mono);
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--text-dim);
  }

  /* ---------- Project tabs ---------- */
  .project-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:2px;
    margin-bottom:16px;
    scrollbar-width:none;
  }
  .project-tabs::-webkit-scrollbar{ display:none; }
  .project-tab{
    font-family:var(--sans);
    font-size:13px;
    font-weight:500;
    white-space:nowrap;
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:8px 16px;
    border-radius:20px;
    flex-shrink:0;
  }
  .project-tab:hover{ border-color:var(--pink); color:var(--pink); }
  .project-tab.active{
    background:var(--amber);
    border-color:var(--amber);
    color:#04150c;
    font-weight:600;
  }
  body.is-running .project-tab:not(.active){
    mix-blend-mode:difference;
    border-color:#ffffff;
    color:#ffffff;
    text-shadow:0 1px 3px rgba(0,0,0,0.6);
    box-shadow:0 0 0 1px rgba(0,0,0,0.35) inset;
  }

  /* ---------- Project tab delete mode (long-press) ---------- */
  .project-tab{
    display:inline-flex;
    align-items:center;
    gap:6px;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  .project-tab .tab-remove{
    display:none;
    align-items:center;
    justify-content:center;
    width:16px;
    height:16px;
    border-radius:50%;
    background:var(--red);
    color:#fff;
    font-size:11px;
    line-height:1;
    flex-shrink:0;
  }
  .project-tabs.delete-mode .project-tab:not([data-filter="__all__"]){
    animation:tabJiggle 0.28s ease-in-out infinite alternate;
    border-color:var(--red);
  }
  .project-tabs.delete-mode .project-tab:not([data-filter="__all__"]) .tab-remove{
    display:inline-flex;
  }
  @keyframes tabJiggle{
    from{ transform:rotate(-1deg); }
    to{ transform:rotate(1deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .project-tabs.delete-mode .project-tab{ animation:none; }
  }
  .tabs-done-row{
    margin-bottom:16px;
  }
  .tabs-done-btn{
    font-family:var(--sans);
    font-size:14px;
    font-weight:700;
    background:none;
    border:1px solid var(--pink);
    color:var(--pink);
    padding:9px 18px;
    border-radius:20px;
  }
  .tabs-done-btn:hover{ background:var(--pink); color:#1a0522; }

  /* ---------- Month switcher ---------- */
  .month-switcher{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin-bottom:16px;
  }
  .month-switcher button{
    background:none;
    border:1px solid var(--line);
    color:var(--text-dim);
    width:32px;
    height:32px;
    min-width:32px;
    min-height:32px;
    max-width:32px;
    max-height:32px;
    padding:0;
    margin:0;
    border-radius:50%;
    font-size:15px;
    line-height:1;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .month-switcher button:hover:not(:disabled){ border-color:var(--pink); color:var(--pink); }
  .month-switcher button:disabled{ opacity:0.3; cursor:not-allowed; }
  .month-switcher .month-label{
    font-family:var(--mono);
    font-size:14px;
    color:var(--text);
    min-width:120px;
    text-align:center;
  }
  body.is-running .month-switcher button{
    mix-blend-mode:difference;
    border-color:#ffffff;
    color:#ffffff;
    text-shadow:0 1px 3px rgba(0,0,0,0.6);
  }

  .log-total-display{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:18px;
    padding-bottom:16px;
    border-bottom:1px solid var(--line);
  }
  .log-total-display .ltd-label{
    font-size:14px;
    color:var(--text);
    font-weight:600;
  }
  .log-total-display .ltd-value{
    font-family:var(--mono);
    font-size:20px;
    color:var(--amber);
  }

  .log-entry{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .log-entry:last-child{ border-bottom:none; }
  .log-entry .le-project{ color:var(--text); }
  .log-entry .le-date{ color:var(--text-dim); font-size:12px; margin-top:2px; }
  .log-entry .le-times{
    font-family:var(--mono);
    color:var(--text-dim);
    font-size:11.5px;
    margin-top:3px;
    letter-spacing:0.01em;
  }
  .le-right{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
    flex-shrink:0;
  }
  .log-entry .le-dur{ font-family:var(--mono); color:var(--amber); }
  .le-actions{
    display:flex;
    gap:10px;
  }
  .le-actions button{
    background:none;
    border:none;
    padding:0;
    font-family:var(--sans);
    font-size:12px;
    color:var(--text-dim);
    text-decoration:underline;
    cursor:pointer;
  }
  .le-actions button:hover{ color:var(--text); }
  .le-actions .le-delete:hover{ color:var(--red); }
  .log-empty{
    color:var(--text-dim);
    font-size:13.5px;
    text-align:center;
    padding:24px 0;
  }

  /* ---------- Inline edit row ---------- */
  .le-edit{
    width:100%;
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px;
    margin:10px 0;
    display:flex;
    flex-direction:column;
    gap:10px;
    overflow:hidden;
  }
  .le-edit-row{
    display:flex;
    gap:10px;
  }
  .le-edit-field{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .le-edit-field label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--text-dim);
  }
  .le-edit input[type=date],
  .le-edit input[type=time]{
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--mono);
    font-size:14px;
    padding:9px 8px;
    border-radius:6px;
    outline:none;
    width:100%;
    min-width:0;
  }
  .le-edit select{
    font-size:14px;
    padding:9px 10px;
  }
  .le-edit input:focus{ border-color:var(--amber); }
  .le-edit-actions{
    display:flex;
    gap:8px;
    justify-content:flex-end;
  }
  .le-edit-actions button{
    font-size:13px;
    padding:9px 16px;
  }
  .le-edit-error{
    font-size:12px;
    color:var(--red);
  }

  /* ---------- Export panel ---------- */
  .export-panel{
    width:100%;
    max-width:480px;
    margin-top:28px;
    padding-top:20px;
    border-top:1px solid var(--line);
  }
  .export-panel h2{
    font-family:var(--mono);
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--text-dim);
    margin-bottom:12px;
  }
  .export-row{
    display:flex;
    gap:8px;
  }
  .export-row select{ flex:1; }
  .export-row button{
    background:var(--bg-raised);
    border:1px solid var(--line);
    color:var(--text);
    font-size:14px;
    padding:0 18px;
    white-space:nowrap;
  }
  .export-row button:hover{ border-color:var(--pink); color:var(--pink); }

  .setup-note{
    max-width:480px;
    width:100%;
    background:var(--bg-raised);
    border:1px dashed var(--line);
    border-radius:10px;
    padding:16px 18px;
    font-size:13px;
    color:var(--text-dim);
    line-height:1.6;
    margin-top:24px;
  }
  .setup-note code{
    font-family:var(--mono);
    background:var(--bg);
    padding:1px 6px;
    border-radius:4px;
    color:var(--amber);
  }

  footer{
    text-align:center;
    padding:20px;

</style>
</head>
<body>

<div class="bg-gradient" id="bgGradient" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>
</div>

<div class="brand"><span class="dot" id="statusDot"></span><span id="brandText">tap timer</span></div>
<a class="handle-link" id="handleLink" href="#" style="display:none;"></a>

<div class="wrap" id="app"></div>

<footer>built for taps, not for typing</footer>

<script>
/* ============================================================
   Local store — this is the only storage layer. Everything lives
   in this browser's localStorage, keyed by handle. No server,
   no accounts, no network calls. Works great as long as taps
   always open in the same browser on the same device.
   ============================================================ */
const LocalStore = {
  key(handle){ return `tap-timer:${handle}`; },
  load(handle){
    try { return JSON.parse(localStorage.getItem(this.key(handle))) || null; }
    catch { return null; }
  },
  save(handle, data){
    localStorage.setItem(this.key(handle), JSON.stringify(data));
  }
};

/* ============================================================
   Data layer
   Shape per handle:
   {
     display_name: string,
     projects: [{id, name}],
     entries: [{id, project_id, started_at, ended_at, duration_sec}],
     running: {started_at, project_id|null} | null
   }
   ============================================================ */
const DEFAULT_DATA = () => ({ display_name: "", projects: [], entries: [], running: null });

/* ============================================================
   CONFIG — JSONBin.io settings.
   Create a free bin at jsonbin.io, put {} as its initial content,
   then paste your Bin ID and X-Master-Key below.
   ============================================================ */
const JSONBIN_BIN_ID = "6a836fdff5f4af5e2921a8f7";
const JSONBIN_MASTER_KEY = "$2a$10$dVWVq5ObAr4mzJAOXxbh9u/zZ2oFFg5NBEG90AzxWMYDxrpCKKu1i";
const JSONBIN_READY = JSONBIN_BIN_ID !== "YOUR_BIN_ID" && JSONBIN_MASTER_KEY !== "YOUR_MASTER_KEY";
const JSONBIN_BASE = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

async function jsonbinReadAll(){
  const res = await fetch(`${JSONBIN_BASE}/latest`, {
    headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
  });
  if (!res.ok) throw new Error(`JSONBin read failed: ${res.status}`);
  const json = await res.json();
  return json.record || {};
}

async function jsonbinWriteAll(allData){
  const res = await fetch(JSONBIN_BASE, {
    method: 'PUT',
    headers: {
      'Content-Type': 'application/json',
      'X-Master-Key': JSONBIN_MASTER_KEY
    },
    body: JSON.stringify(allData)
  });
  if (!res.ok) throw new Error(`JSONBin write failed: ${res.status}`);
}

async function fetchData(handle){
  // Always warm the local cache first so the UI can render instantly.
  const cached = LocalStore.load(handle);
  if (!JSONBIN_READY) return cached || DEFAULT_DATA();

  try {
    const allData = await jsonbinReadAll();
    const remote = allData[handle];
    if (remote){
      LocalStore.save(handle, remote); // keep local cache fresh
      return remote;
    }
    return cached || DEFAULT_DATA();
  } catch (e){
    console.warn('Sync unavailable, using local copy:', e);
    return cached || DEFAULT_DATA();
  }
}

async function saveData(handle, data){
  LocalStore.save(handle, data); // instant local cache, always happens
  if (!JSONBIN_READY) return;

  try {
    // Re-fetch the whole bin right before writing, to minimize the chance
    // of clobbering another device's save that landed in between.
    const allData = await jsonbinReadAll().catch(() => ({}));
    allData[handle] = data;
    await jsonbinWriteAll(allData);
  } catch (e){
    console.warn('Sync save failed, change is saved locally only:', e);
  }
}

/* ============================================================
   Helpers
   ============================================================ */
function getHandleFromURL(){
  const params = new URLSearchParams(window.location.search);
  return (params.get('u') || '').trim();
}
function randomHandle(){
  const words = ["ember","quartz","willow","cedar","tide","moss","flint","opal","birch","dune","coral","linen","slate","amber","pine","rye"];
  const w = words[Math.floor(Math.random()*words.length)];
  const n = Math.floor(1000 + Math.random()*9000);
  return `${w}-${n}`;
}
function slugify(s){
  return s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
}
function fmtClock(totalSeconds){
  const h = Math.floor(totalSeconds/3600);
  const m = Math.floor((totalSeconds%3600)/60);
  const s = Math.floor(totalSeconds%60);
  const pad = n => String(n).padStart(2,'0');
  return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
function fmtDuration(totalSeconds){
  const h = Math.floor(totalSeconds/3600);
  const m = Math.round((totalSeconds%3600)/60);
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
}
function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
}
function toDateInputValue(iso){
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function toTimeInputValue(iso){
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function combineDateTime(dateStr, timeStr){
  // dateStr: "2026-08-17", timeStr: "14:30" -> Date in local time
  const [y,mo,da] = dateStr.split('-').map(Number);
  const [h,mi] = timeStr.split(':').map(Number);
  return new Date(y, mo-1, da, h, mi, 0, 0);
}
function toMonthKey(iso){
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function fmtMonthLabel(monthKey){
  const [y, mo] = monthKey.split('-').map(Number);
  const d = new Date(y, mo-1, 1);
  return d.toLocaleDateString(undefined, { month:'long', year:'numeric' });
}
function shiftMonthKey(monthKey, delta){
  const [y, mo] = monthKey.split('-').map(Number);
  const d = new Date(y, mo-1+delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function csvEscape(val){
  const s = String(val);
  if (/[",\n]/.test(s)) return `"${s.replace(/"/g,'""')}"`;
  return s;
}
function uid(){
  return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
}
function setURLHandle(handle){
  const url = new URL(window.location.href);
  url.searchParams.set('u', handle);
  window.history.replaceState({}, '', url);
}
function setStatusDot(state){
  const dot = document.getElementById('statusDot');
  dot.className = 'dot' + (state ? ' ' + state : '');
  document.body.classList.toggle('is-running', state === 'running');
}

/* ============================================================
   App state
   ============================================================ */
let HANDLE = getHandleFromURL();
let DATA = null;
let tickInterval = null;

const app = document.getElementById('app');
const handleLink = document.getElementById('handleLink');
const brandText = document.getElementById('brandText');

async function init(){
  if (!HANDLE){
    renderOnboarding();
    return;
  }
  DATA = await fetchData(HANDLE);
  handleLink.style.display = 'inline-block';
  handleLink.href = `?u=${encodeURIComponent(HANDLE)}`;
  handleLink.textContent = DATA.display_name ? DATA.display_name : HANDLE;
  brandText.textContent = 'tap timer';
  renderTracker();
}

/* ---------- Onboarding screen ---------- */
function renderOnboarding(){
  setStatusDot(null);
  app.innerHTML = `
    <div class="onboard">
      <h1>Make your tap timer</h1>
      <p>Tap an NFC tag, start a clock instantly. Stop it whenever, then decide which project it belongs to. Nobody sees your data unless they have your exact link.</p>
      <div class="field">
        <label for="handleInput">Choose a handle</label>
        <input type="text" id="handleInput" placeholder="e.g. amy-jiang" autocomplete="off" autocapitalize="off" spellcheck="false" />
        <div class="hint">This becomes your link: <span id="previewURL" style="color:var(--amber)"></span></div>
      </div>
      <button class="btn-primary" id="createBtn">Create my timer</button>
      <div style="margin-top:14px;">
        <button class="btn-ghost" id="randomBtn" style="width:100%;">Or generate a random one</button>
      </div>
      <div class="setup-note" style="text-align:left;">
        ${JSONBIN_READY
          ? `<strong style="color:var(--green)">Sync is on.</strong> This handle's data will follow you to any device that opens the same link.`
          : `<strong style="color:var(--text)">One thing to know:</strong> sync isn't set up yet, so this saves in the browser you're using right now. Open the link in a different browser or device later, and it starts fresh there.`
        }
      </div>
    </div>
  `;

  const input = document.getElementById('handleInput');
  const preview = document.getElementById('previewURL');
  const base = window.location.origin + window.location.pathname;

  function updatePreview(){
    const slug = slugify(input.value) || 'your-handle';
    preview.textContent = `${base}?u=${slug}`;
  }
  input.addEventListener('input', updatePreview);
  updatePreview();

  document.getElementById('createBtn').addEventListener('click', async () => {
    const slug = slugify(input.value);
    if (!slug){ input.focus(); return; }
    HANDLE = slug;
    setURLHandle(HANDLE);
    DATA = DEFAULT_DATA();
    await saveData(HANDLE, DATA);
    await init();
  });

  document.getElementById('randomBtn').addEventListener('click', async () => {
    HANDLE = randomHandle();
    setURLHandle(HANDLE);
    DATA = DEFAULT_DATA();
    await saveData(HANDLE, DATA);
    await init();
  });
}

/* ---------- Main tracker screen ---------- */
function renderTracker(){
  const running = DATA.running;
  setStatusDot(running ? 'running' : null);

  app.innerHTML = `
    <div class="tracker">
      ${running && running.project_id ? projectTagHTML() : ''}
      <div class="clockface ${running ? 'running' : 'idle'}" id="clockface">00:00</div>
      <div class="status-line" id="statusLine"></div>
      <div class="main-action" id="mainAction"></div>
      <div id="assignSlot"></div>
      <div class="utility-row" id="utilityRow">
        <button id="addProjectUtilBtn">+ Add project</button>
        <button id="addEntryUtilBtn">+ Add entry</button>
      </div>
    </div>
    <div class="log" id="logSection"></div>
    ${!JSONBIN_READY ? `<div class="setup-note">Saving locally to this browser only. To sync across devices, add your JSONBin credentials at the top of <code>index.html</code>.</div>` : ''}
  `;

  renderMainAction();
  renderLog();

  document.getElementById('addProjectUtilBtn').addEventListener('click', openAddProjectModal);
  document.getElementById('addEntryUtilBtn').addEventListener('click', openAddEntryModal);

  if (tickInterval) clearInterval(tickInterval);
  if (running){
    tickClock();
    tickInterval = setInterval(tickClock, 1000);
  }
}

function projectTagHTML(){
  const p = DATA.projects.find(p => p.id === DATA.running.project_id);
  return `<div class="project-tag">continuing → <span class="name">${p ? p.name : 'unknown'}</span></div>`;
}

function tickClock(){
  if (!DATA.running) return;
  const clockEl = document.getElementById('clockface');
  if (!clockEl) return;
  const started = new Date(DATA.running.started_at).getTime();
  const now = Date.now();
  const seconds = Math.floor((now - started)/1000);
  clockEl.textContent = fmtClock(seconds);
}

function renderMainAction(){
  const slot = document.getElementById('mainAction');
  const statusLine = document.getElementById('statusLine');
  if (DATA.running){
    statusLine.textContent = `started ${new Date(DATA.running.started_at).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}`;
    slot.innerHTML = `<button class="btn-stop" id="stopBtn">Stop</button>`;
    document.getElementById('stopBtn').addEventListener('click', stopTimer);
  } else {
    statusLine.textContent = 'ready';
    slot.innerHTML = `<button class="btn-primary" id="startBtn">Start</button>`;
    document.getElementById('startBtn').addEventListener('click', startTimer);
  }
  document.getElementById('assignSlot').innerHTML = '';
}

async function startTimer(){
  DATA.running = { started_at: new Date().toISOString(), project_id: null };
  await saveData(HANDLE, DATA);
  renderTracker();
}

async function stopTimer(){
  if (tickInterval){ clearInterval(tickInterval); tickInterval = null; }
  const started = new Date(DATA.running.started_at).getTime();
  const durationSec = Math.max(1, Math.floor((Date.now() - started)/1000));
  renderAssignPanel(durationSec);
}

function renderAssignPanel(durationSec){
  setStatusDot('saved');
  document.getElementById('mainAction').innerHTML = '';
  const utilRow = document.getElementById('utilityRow');
  if (utilRow) utilRow.style.display = 'none';
  const slot = document.getElementById('assignSlot');

  const projectOptions = DATA.projects
    .map(p => `<option value="${p.id}">${escapeHTML(p.name)}</option>`)
    .join('');

  slot.innerHTML = `
    <div class="assign-panel">
      <div class="elapsed-summary">${fmtDuration(durationSec)} tracked</div>
      <select id="projectSelect">
        <option value="">— choose a project —</option>
        ${projectOptions}
        <option value="__new__">+ New project</option>
      </select>
      <div id="newProjectRow" style="display:none;" class="new-project-row">
        <input type="text" id="newProjectName" placeholder="Project name" autocomplete="off" />
        <button id="addProjectBtn">Add</button>
      </div>
      <button class="btn-primary" id="saveEntryBtn" disabled>Save entry</button>
      <button class="btn-danger-text" id="discardBtn">Discard this session</button>
    </div>
  `;

  const select = document.getElementById('projectSelect');
  const newRow = document.getElementById('newProjectRow');
  const newInput = document.getElementById('newProjectName');
  const saveBtn = document.getElementById('saveEntryBtn');

  let pendingProjectId = null;

  select.addEventListener('change', () => {
    if (select.value === '__new__'){
      newRow.style.display = 'flex';
      saveBtn.disabled = true;
      pendingProjectId = null;
      newInput.focus();
    } else {
      newRow.style.display = 'none';
      pendingProjectId = select.value || null;
      saveBtn.disabled = !pendingProjectId;
    }
  });

  document.getElementById('addProjectBtn').addEventListener('click', () => {
    const name = newInput.value.trim();
    if (!name) return;
    const newProj = { id: uid(), name };
    DATA.projects.push(newProj);
    const opt = document.createElement('option');
    opt.value = newProj.id;
    opt.textContent = name;
    select.insertBefore(opt, select.querySelector('option[value="__new__"]'));
    select.value = newProj.id;
    pendingProjectId = newProj.id;
    newRow.style.display = 'none';
    saveBtn.disabled = false;
  });

  newInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){ e.preventDefault(); document.getElementById('addProjectBtn').click(); }
  });

  saveBtn.addEventListener('click', async () => {
    if (!pendingProjectId) return;
    const entry = {
      id: uid(),
      project_id: pendingProjectId,
      started_at: DATA.running.started_at,
      ended_at: new Date().toISOString(),
      duration_sec: durationSec
    };
    DATA.entries.unshift(entry);
    DATA.running = null;
    await saveData(HANDLE, DATA);
    renderTracker();
  });

  document.getElementById('discardBtn').addEventListener('click', async () => {
    DATA.running = null;
    await saveData(HANDLE, DATA);
    renderTracker();
  });
}

let editingEntryId = null;
let logProjectFilter = '__all__';
let logMonthFilter = null; // null = All time; otherwise 'YYYY-MM' string
let tabDeleteMode = false;

/* ============================================================
   Modals: Add project, Add manual entry
   ============================================================ */
function closeModal(){
  const existing = document.getElementById('modalBackdrop');
  if (existing) existing.remove();
}

function openAddProjectModal(){
  closeModal();
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'modalBackdrop';
  backdrop.innerHTML = `
    <div class="modal-panel">
      <h3>New project</h3>
      <div class="modal-field">
        <label for="modalProjectName">Project name</label>
        <input type="text" id="modalProjectName" autocomplete="off" placeholder="e.g. FLORA Fashion Week" />
      </div>
      <div class="modal-error" id="modalProjectError" style="display:none;"></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="modalCancelBtn">Cancel</button>
        <button class="btn-primary" id="modalSaveBtn">Add project</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);

  const input = document.getElementById('modalProjectName');
  input.focus();

  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal(); });
  document.getElementById('modalCancelBtn').addEventListener('click', closeModal);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter'){ e.preventDefault(); document.getElementById('modalSaveBtn').click(); } });

  document.getElementById('modalSaveBtn').addEventListener('click', async () => {
    const name = input.value.trim();
    const errEl = document.getElementById('modalProjectError');
    if (!name){
      errEl.textContent = 'Give the project a name.';
      errEl.style.display = 'block';
      return;
    }
    DATA.projects.push({ id: uid(), name });
    await saveData(HANDLE, DATA);
    closeModal();
    renderLog();
  });
}

function openAddEntryModal(){
  closeModal();
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'modalBackdrop';

  const projectOptions = DATA.projects
    .map(p => `<option value="${p.id}">${escapeHTML(p.name)}</option>`)
    .join('');

  const todayStr = toDateInputValue(new Date().toISOString());

  backdrop.innerHTML = `
    <div class="modal-panel">
      <h3>Add entry manually</h3>
      <div class="modal-field">
        <label for="modalEntryProject">Project</label>
        <select id="modalEntryProject">
          <option value="">— choose a project —</option>
          ${projectOptions}
          <option value="__new__">+ New project</option>
        </select>
      </div>
      <div class="modal-field" id="modalNewProjectField" style="display:none;">
        <label for="modalNewProjectName">New project name</label>
        <input type="text" id="modalNewProjectName" autocomplete="off" placeholder="Project name" />
      </div>
      <div class="modal-field">
        <label for="modalEntryDate">Date</label>
        <input type="date" id="modalEntryDate" value="${todayStr}" />
      </div>
      <div class="modal-row">
        <div class="modal-field">
          <label for="modalEntryIn">Clock in</label>
          <input type="time" id="modalEntryIn" />
        </div>
        <div class="modal-field">
          <label for="modalEntryOut">Clock out</label>
          <input type="time" id="modalEntryOut" />
        </div>
      </div>
      <div class="modal-error" id="modalEntryError" style="display:none;"></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="modalCancelBtn">Cancel</button>
        <button class="btn-primary" id="modalSaveBtn">Save entry</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);

  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal(); });
  document.getElementById('modalCancelBtn').addEventListener('click', closeModal);

  const projectSelect = document.getElementById('modalEntryProject');
  const newProjectField = document.getElementById('modalNewProjectField');
  projectSelect.addEventListener('change', () => {
    newProjectField.style.display = projectSelect.value === '__new__' ? 'flex' : 'none';
  });

  document.getElementById('modalSaveBtn').addEventListener('click', async () => {
    const errEl = document.getElementById('modalEntryError');
    let projectId = projectSelect.value;
    const dateVal = document.getElementById('modalEntryDate').value;
    const inVal = document.getElementById('modalEntryIn').value;
    const outVal = document.getElementById('modalEntryOut').value;

    if (projectId === '__new__'){
      const newName = document.getElementById('modalNewProjectName').value.trim();
      if (!newName){
        errEl.textContent = 'Give the new project a name.';
        errEl.style.display = 'block';
        return;
      }
      const newProj = { id: uid(), name: newName };
      DATA.projects.push(newProj);
      projectId = newProj.id;
    }

    if (!projectId){
      errEl.textContent = 'Choose a project.';
      errEl.style.display = 'block';
      return;
    }
    if (!dateVal || !inVal || !outVal){
      errEl.textContent = 'Fill in the date, clock in, and clock out.';
      errEl.style.display = 'block';
      return;
    }

    let start = combineDateTime(dateVal, inVal);
    let end = combineDateTime(dateVal, outVal);
    if (end <= start){
      end = new Date(end.getTime() + 24*60*60*1000);
    }
    const durationSec = Math.round((end - start)/1000);

    DATA.entries.unshift({
      id: uid(),
      project_id: projectId,
      started_at: start.toISOString(),
      ended_at: end.toISOString(),
      duration_sec: durationSec
    });

    await saveData(HANDLE, DATA);
    closeModal();
    renderLog();
  });
}

function renderLog(){
  const section = document.getElementById('logSection');
  if (!DATA.entries.length){
    section.innerHTML = `
      <div class="log-header"><h2>Log</h2></div>
      <div class="log-empty">No sessions yet. Tap the tag to start your first one.</div>
    `;
    renderExportPanel();
    return;
  }

  // All months that have at least one entry, sorted oldest to newest
  const allMonthKeys = Array.from(new Set(DATA.entries.map(e => toMonthKey(e.started_at)))).sort();
  const earliestMonth = allMonthKeys[0];
  const latestMonth = allMonthKeys[allMonthKeys.length - 1];

  // Default to the most recent month with data, the first time the log renders
  if (logMonthFilter === null){
    logMonthFilter = latestMonth;
  }
  // If the selected month somehow has no data any more (e.g. its only entry got deleted),
  // fall back to the latest month that does.
  if (!allMonthKeys.includes(logMonthFilter)){
    logMonthFilter = latestMonth;
  }

  const monthEntries = DATA.entries.filter(e => toMonthKey(e.started_at) === logMonthFilter);

  // Per-project totals, computed within the selected month only
  const totalsByProject = {};
  let grandTotal = 0;
  monthEntries.forEach(e => {
    totalsByProject[e.project_id] = (totalsByProject[e.project_id] || 0) + e.duration_sec;
    grandTotal += e.duration_sec;
  });

  // Only show tabs for projects that have time in the selected month, sorted by most time first
  const projectsWithTime = DATA.projects
    .filter(p => totalsByProject[p.id])
    .sort((a,b) => totalsByProject[b.id] - totalsByProject[a.id]);

  // If the currently selected filter has no entries in this month, fall back to All
  if (logProjectFilter !== '__all__' && !totalsByProject[logProjectFilter]){
    logProjectFilter = '__all__';
  }

  const tabsHTML = [`<button class="project-tab ${logProjectFilter === '__all__' ? 'active' : ''}" data-filter="__all__">All</button>`]
    .concat(projectsWithTime.map(p => `
      <button class="project-tab ${logProjectFilter === p.id ? 'active' : ''}" data-filter="${p.id}">
        <span class="tab-remove" data-project-id="${p.id}">×</span>${escapeHTML(p.name)}
      </button>
    `))
    .join('');

  // Filtered entry list + label/total that follow the active filters
  const filteredEntries = logProjectFilter === '__all__'
    ? monthEntries
    : monthEntries.filter(e => e.project_id === logProjectFilter);

  const activeProject = logProjectFilter === '__all__'
    ? null
    : DATA.projects.find(p => p.id === logProjectFilter);

  const totalLabel = activeProject ? `${activeProject.name} total` : 'All projects total';
  const totalValue = logProjectFilter === '__all__'
    ? grandTotal
    : (totalsByProject[logProjectFilter] || 0);

  const rows = filteredEntries.slice(0, 25).map(e => {
    const p = DATA.projects.find(p => p.id === e.project_id);
    if (editingEntryId === e.id){
      return renderEditRow(e);
    }
    return `
      <div class="log-entry" data-entry-id="${e.id}">
        <div>
          <div class="le-project">${p ? escapeHTML(p.name) : 'unassigned'}</div>
          <div class="le-date">${fmtDate(e.started_at)}</div>
          <div class="le-times">${fmtTime(e.started_at)} → ${fmtTime(e.ended_at)}</div>
        </div>
        <div class="le-right">
          <div class="le-dur">${fmtDuration(e.duration_sec)}</div>
          <div class="le-actions">
            <button class="le-edit-btn" data-id="${e.id}">Edit</button>
            <button class="le-delete" data-id="${e.id}">Delete</button>
          </div>
        </div>
      </div>
    `;
  }).join('');

  const canGoEarlier = logMonthFilter > earliestMonth;
  const canGoLater = logMonthFilter < latestMonth;

  section.innerHTML = `
    <div class="log-header">
      <h2>Log</h2>
    </div>
    <div class="month-switcher">
      <button id="monthPrevBtn" ${canGoEarlier ? '' : 'disabled'} aria-label="Previous month">‹</button>
      <span class="month-label">${fmtMonthLabel(logMonthFilter)}</span>
      <button id="monthNextBtn" ${canGoLater ? '' : 'disabled'} aria-label="Next month">›</button>
    </div>
    <div class="project-tabs" id="projectTabs">${tabsHTML}</div>
    ${tabDeleteMode ? `
    <div class="tabs-done-row">
      <button class="tabs-done-btn" id="tabsDoneBtn">Done</button>
    </div>
    ` : ''}
    <div class="log-total-display" id="logTotalDisplay">
      <span class="ltd-label">${escapeHTML(totalLabel)}</span>
      <span class="ltd-value">${fmtDuration(totalValue)}</span>
    </div>
    ${rows || `<div class="log-empty">No sessions for this project this month.</div>`}
  `;

  if (tabDeleteMode){
    document.getElementById('projectTabs').classList.add('delete-mode');
  }

  document.getElementById('monthPrevBtn').addEventListener('click', () => {
    if (!canGoEarlier) return;
    logMonthFilter = shiftMonthKey(logMonthFilter, -1);
    logProjectFilter = '__all__';
    editingEntryId = null;
    renderLog();
  });
  document.getElementById('monthNextBtn').addEventListener('click', () => {
    if (!canGoLater) return;
    logMonthFilter = shiftMonthKey(logMonthFilter, 1);
    logProjectFilter = '__all__';
    editingEntryId = null;
    renderLog();
  });

  const tabsDoneBtn = document.getElementById('tabsDoneBtn');
  if (tabsDoneBtn){
    tabsDoneBtn.addEventListener('click', () => {
      tabDeleteMode = false;
      renderLog();
    });
  }

  attachProjectTabHandlers(section);

  section.querySelectorAll('.le-edit-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      editingEntryId = btn.dataset.id;
      renderLog();
    });
  });
  section.querySelectorAll('.le-delete').forEach(btn => {
    btn.addEventListener('click', async () => {
      const entry = DATA.entries.find(e => e.id === btn.dataset.id);
      const label = entry ? `${fmtDate(entry.started_at)}, ${fmtDuration(entry.duration_sec)}` : 'this entry';
      if (!confirm(`Delete ${label}? This can't be undone.`)) return;
      DATA.entries = DATA.entries.filter(e => e.id !== btn.dataset.id);
      await saveData(HANDLE, DATA);
      renderLog();
    });
  });

  renderExportPanel();
}

function attachProjectTabHandlers(section){
  const LONG_PRESS_MS = 500;

  section.querySelectorAll('.project-tab').forEach(btn => {
    const filterId = btn.dataset.filter;
    let pressTimer = null;
    let longPressFired = false;

    const startPress = () => {
      if (filterId === '__all__') return; // "All" can't be long-pressed into delete mode
      longPressFired = false;
      pressTimer = setTimeout(() => {
        longPressFired = true;
        tabDeleteMode = true;
        renderLog();
      }, LONG_PRESS_MS);
    };
    const cancelPress = () => {
      if (pressTimer) clearTimeout(pressTimer);
    };

    btn.addEventListener('mousedown', startPress);
    btn.addEventListener('mouseup', cancelPress);
    btn.addEventListener('mouseleave', cancelPress);
    btn.addEventListener('touchstart', startPress, { passive:true });
    btn.addEventListener('touchend', cancelPress);
    btn.addEventListener('touchmove', cancelPress);
    btn.addEventListener('contextmenu', (e) => { if (tabDeleteMode || filterId !== '__all__') e.preventDefault(); });

    btn.addEventListener('click', (e) => {
      if (longPressFired){ longPressFired = false; return; } // long-press already handled this interaction
      if (tabDeleteMode) return; // in delete mode, taps only work through the × handler below
      logProjectFilter = filterId;
      editingEntryId = null;
      renderLog();
    });
  });

  section.querySelectorAll('.tab-remove').forEach(x => {
    x.addEventListener('click', async (e) => {
      e.stopPropagation();
      const projectId = x.dataset.projectId;
      const project = DATA.projects.find(p => p.id === projectId);
      if (!project) return;
      const entryCount = DATA.entries.filter(en => en.project_id === projectId).length;
      const countText = entryCount === 1 ? '1 entry' : `${entryCount} entries`;
      const confirmed = confirm(
        `Delete "${project.name}"? This won't delete your ${countText} — they'll be kept but marked as unassigned.`
      );
      if (!confirmed) return;

      DATA.entries.forEach(en => {
        if (en.project_id === projectId) en.project_id = null;
      });
      DATA.projects = DATA.projects.filter(p => p.id !== projectId);
      if (logProjectFilter === projectId) logProjectFilter = '__all__';

      await saveData(HANDLE, DATA);
      renderLog();
    });
  });
}

function renderEditRow(e){
  const p = DATA.projects.find(p => p.id === e.project_id);
  const projectOptions = DATA.projects
    .map(pr => `<option value="${pr.id}" ${pr.id === e.project_id ? 'selected' : ''}>${escapeHTML(pr.name)}</option>`)
    .join('');
  return `
    <div class="le-edit" data-entry-id="${e.id}">
      <div style="font-size:13px; color:var(--text-dim);">${fmtDate(e.started_at)}</div>
      <div class="le-edit-field">
        <label>Project</label>
        <select id="editProject_${e.id}">
          ${projectOptions}
          <option value="__new__">+ New project</option>
        </select>
      </div>
      <div class="le-edit-field" id="editNewProjectField_${e.id}" style="display:none;">
        <label>New project name</label>
        <input type="text" id="editNewProjectName_${e.id}" placeholder="Project name" autocomplete="off" />
      </div>
      <div class="le-edit-field">
        <label>Date</label>
        <input type="date" id="editDate_${e.id}" value="${toDateInputValue(e.started_at)}" />
      </div>
      <div class="le-edit-row">
        <div class="le-edit-field">
          <label>In</label>
          <input type="time" id="editIn_${e.id}" value="${toTimeInputValue(e.started_at)}" />
        </div>
        <div class="le-edit-field">
          <label>Out</label>
          <input type="time" id="editOut_${e.id}" value="${toTimeInputValue(e.ended_at)}" />
        </div>
      </div>
      <div class="le-edit-error" id="editError_${e.id}" style="display:none;"></div>
      <div class="le-edit-actions">
        <button class="btn-ghost" id="editCancel_${e.id}">Cancel</button>
        <button class="btn-primary" id="editSave_${e.id}" style="width:auto;">Save</button>
      </div>
    </div>
  `;
}

function attachEditHandlers(){
  if (!editingEntryId) return;
  const id = editingEntryId;
  const cancelBtn = document.getElementById(`editCancel_${id}`);
  const saveBtn = document.getElementById(`editSave_${id}`);
  const projectSelect = document.getElementById(`editProject_${id}`);
  const newProjectField = document.getElementById(`editNewProjectField_${id}`);

  if (projectSelect) projectSelect.addEventListener('change', () => {
    newProjectField.style.display = projectSelect.value === '__new__' ? 'flex' : 'none';
  });

  if (cancelBtn) cancelBtn.addEventListener('click', () => {
    editingEntryId = null;
    renderLog();
  });
  if (saveBtn) saveBtn.addEventListener('click', async () => {
    const entry = DATA.entries.find(en => en.id === id);
    if (!entry) return;
    const dateVal = document.getElementById(`editDate_${id}`).value;
    const inVal = document.getElementById(`editIn_${id}`).value;
    const outVal = document.getElementById(`editOut_${id}`).value;
    const errEl = document.getElementById(`editError_${id}`);
    let projectId = projectSelect ? projectSelect.value : entry.project_id;

    if (projectId === '__new__'){
      const newName = document.getElementById(`editNewProjectName_${id}`).value.trim();
      if (!newName){
        errEl.textContent = 'Give the new project a name.';
        errEl.style.display = 'block';
        return;
      }
      const newProj = { id: uid(), name: newName };
      DATA.projects.push(newProj);
      projectId = newProj.id;
    }

    if (!dateVal || !inVal || !outVal){
      errEl.textContent = 'All fields are required.';
      errEl.style.display = 'block';
      return;
    }
    let start = combineDateTime(dateVal, inVal);
    let end = combineDateTime(dateVal, outVal);
    if (end <= start){
      // assume clock-out rolled past midnight
      end = new Date(end.getTime() + 24*60*60*1000);
    }
    const durationSec = Math.round((end - start)/1000);
    entry.project_id = projectId;
    entry.started_at = start.toISOString();
    entry.ended_at = end.toISOString();
    entry.duration_sec = durationSec;
    await saveData(HANDLE, DATA);
    editingEntryId = null;
    renderLog();
  });
}

/* ============================================================
   CSV export
   ============================================================ */
function renderExportPanel(){
  const wrap = document.getElementById('logSection');
  if (!wrap) return;

  const projectOptions = DATA.projects
    .map(p => `<option value="${p.id}">${escapeHTML(p.name)}</option>`)
    .join('');

  const panel = document.createElement('div');
  panel.className = 'export-panel';
  panel.innerHTML = `
    <h2>Export</h2>
    <div class="export-row">
      <select id="exportProjectSelect">
        <option value="__all__">All projects</option>
        ${projectOptions}
      </select>
      <button id="exportCsvBtn">Download CSV</button>
    </div>
  `;
  wrap.appendChild(panel);

  document.getElementById('exportCsvBtn').addEventListener('click', () => {
    const projectId = document.getElementById('exportProjectSelect').value;
    exportCSV(projectId);
  });

  // Re-attach edit handlers now that the log section is fully in the DOM
  attachEditHandlers();
}

function exportCSV(projectFilter){
  let entries = DATA.entries.slice();
  if (projectFilter && projectFilter !== '__all__'){
    entries = entries.filter(e => e.project_id === projectFilter);
  }
  // chronological order in the export, oldest first
  entries = entries.slice().sort((a,b) => new Date(a.started_at) - new Date(b.started_at));

  const header = ['Date','Clock In','Clock Out','Duration (h:mm)','Project'];
  const lines = [header.map(csvEscape).join(',')];

  entries.forEach(e => {
    const p = DATA.projects.find(p => p.id === e.project_id);
    const h = Math.floor(e.duration_sec/3600);
    const m = Math.round((e.duration_sec%3600)/60);
    const durStr = `${h}:${String(m).padStart(2,'0')}`;
    lines.push([
      toDateInputValue(e.started_at),
      fmtTime(e.started_at),
      fmtTime(e.ended_at),
      durStr,
      p ? p.name : 'unassigned'
    ].map(csvEscape).join(','));
  });

  const csvContent = lines.join('\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const projLabel = (!projectFilter || projectFilter === '__all__')
    ? 'all-projects'
    : slugify((DATA.projects.find(p => p.id === projectFilter) || {}).name || 'project');
  const datePart = toDateInputValue(new Date().toISOString());
  a.href = url;
  a.download = `tap-timer_${HANDLE}_${projLabel}_${datePart}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function escapeHTML(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Global tap-outside-to-exit for project tab delete mode.
// Bound once, not per-render, so it doesn't stack up duplicate listeners.
document.addEventListener('click', (e) => {
  if (!tabDeleteMode) return;
  const tabsEl = document.getElementById('projectTabs');
  const doneBtn = document.getElementById('tabsDoneBtn');
  const clickedInsideTabs = tabsEl && tabsEl.contains(e.target);
  const clickedDoneBtn = doneBtn && doneBtn.contains(e.target);
  if (clickedInsideTabs || clickedDoneBtn) return; // let their own handlers deal with it
  tabDeleteMode = false;
  renderLog();
});

init();
</script>
